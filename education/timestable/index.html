<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quest: Times Tables!</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="app">
        <!-- Setup Screen -->
        <div id="setup-screen" class="screen active">
            <img src="mascot.png" alt="Cute Mascot" class="mascot-img"
                onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><text y=\'50\' font-size=\'50\'>🤖</text></svg>'">
            <h1>Math Quest! 🚀</h1>
            <p>Select the times tables you want to practice:</p>

            <div class="tables-grid" id="tables-grid">
                <!-- Checkboxes 1 to 12 injected by JS -->
            </div>

            <div class="settings">
                <label for="max-multiplier">How high to go?</label>
                <input type="number" id="max-multiplier" min="1" max="20" value="12">
            </div>

            <button id="start-btn" class="btn primary">Start Adventure! ⭐</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="top-bar">
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <div id="progress-text">1 / 10</div>
            </div>

            <div class="question-container">
                <div id="question" class="question">6 × 7 = ?</div>
            </div>

            <div class="answer-container">
                <input type="number" id="answer-input" placeholder="Value" autocomplete="off" autofocus>
                <button id="submit-btn" class="btn secondary">Check!</button>
            </div>

            <div id="feedback" class="feedback hidden">Correct! 🎉</div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <img src="star.png" alt="Star" class="star-img"
                onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><text y=\'50\' font-size=\'50\'>⭐</text></svg>'">
            <h1>Adventure Complete! 🏆</h1>
            <div class="score-board">
                <div class="score-circle">
                    <span id="score-percentage">100%</span>
                </div>
            </div>

            <div id="incorrect-review" class="incorrect-review hidden">
                <h3>Let's review these:</h3>
                <ul id="incorrect-list">
                    <!-- Incorrect items injected by JS -->
                </ul>
            </div>

            <button id="retry-btn" class="btn primary">Play Again! 🔄</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
